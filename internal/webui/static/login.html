<!doctype html>
<html lang="fr-CH" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>K-CRM · Connexion</title>
  <script>
    (() => {
      try {
        const theme = localStorage.getItem("kcrm-alt-theme");
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      } catch (_) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="/pupitre.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <symbol id="LockKeyhole" viewBox="0 0 24 24"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></symbol>
      <symbol id="Eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="EyeOff" viewBox="0 0 24 24"><path d="m2 2 20 20"/><path d="M6.71 6.71A10.7 10.7 0 0 0 2.06 11.65a1 1 0 0 0 0 .7A10.75 10.75 0 0 0 18 17.94"/><path d="M10.73 5.08A10.8 10.8 0 0 1 21.94 11.65a1 1 0 0 1 0 .7 10.8 10.8 0 0 1-1.72 2.75"/><path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"/></symbol>
    </defs>
  </svg>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand-product">
        <div class="product-name">K-CRM</div>
        <div class="product-copy">pupitre</div>
      </div>
      <nav class="nav" aria-label="Navigation">
        <button class="nav-btn" type="button" aria-current="page">Accès</button>
      </nav>
      <div class="sidebar-foot">
        <strong>Accès protégé</strong>
        <span>Connexion requise</span>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumb">
          <small>Pupitre</small>
          <strong>Connexion</strong>
        </div>
      </header>
      <section class="gate-stage">
        <section class="gate-card" aria-labelledby="loginTitle">
          <div class="overline"><svg class="icon" aria-hidden="true"><use href="#LockKeyhole"/></svg>Accès protégé</div>
          <h1 id="loginTitle">Connexion</h1>
          <p class="intro">Un utilisateur. Mot de passe, puis le code à six chiffres.</p>
          <form class="gate-form" id="login" novalidate>
            <div class="field">
              <label for="user">Identifiant</label>
              <input id="user" name="user" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="password">Mot de passe</label>
              <div class="pw-wrap">
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="pw-toggle" type="button" id="pwToggle" aria-label="Afficher le mot de passe">
                  <svg class="icon" aria-hidden="true"><use href="#Eye"/></svg>
                </button>
              </div>
            </div>
            <div class="field">
              <label for="code">Code 2FA</label>
              <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
            </div>
            <p class="form-error" id="err" aria-live="polite"></p>
            <button class="btn primary gate-submit" id="submit" type="submit">Se connecter</button>
          </form>
          <p class="gate-note"><svg class="icon" aria-hidden="true"><use href="#LockKeyhole"/></svg>Connexion requise. Rien n’est public.</p>
        </section>
      </section>
    </main>
  </div>
  <script>
    const pw = document.getElementById("password");
    const toggle = document.getElementById("pwToggle");
    toggle.addEventListener("click", () => {
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      toggle.setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe");
      toggle.querySelector("use").setAttribute("href", show ? "#EyeOff" : "#Eye");
    });
    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      const submit = document.getElementById("submit");
      const user = document.getElementById("user");
      const code = document.getElementById("code");
      err.textContent = "";
      if (!user.value.trim() || !pw.value || !code.value.trim()) {
        err.textContent = "Identifiant, mot de passe et code 2FA sont requis.";
        (!user.value.trim() ? user : !pw.value ? pw : code).focus();
        return;
      }
      submit.disabled = true;
      submit.textContent = "Connexion…";
      try {
        const r = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: user.value.trim(), password: pw.value, code: code.value.trim() })
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          err.textContent = data.error === "invalid login" ? "Identifiant, mot de passe ou code refusé." : (data.error || "Connexion refusée");
          submit.disabled = false;
          submit.textContent = "Se connecter";
          return;
        }
        location.href = "/";
      } catch (_) {
        err.textContent = "Le pupitre ne répond pas. Réessaie.";
        submit.disabled = false;
        submit.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
